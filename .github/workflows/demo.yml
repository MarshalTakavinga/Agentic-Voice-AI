name: demo

on:
  push:
    branches: [main]
    paths: ["demo/**", "01-agentic-voice-ivr/**", "02-sip-call-doctor/**", "03-voice-agent-evals/**", ".github/workflows/demo.yml"]
  pull_request:
    paths: ["demo/**", "01-agentic-voice-ivr/**", "02-sip-call-doctor/**", "03-voice-agent-evals/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: demo/requirements.txt
      - run: pip install -r demo/requirements.txt ruff
      - name: Lint
        run: ruff check demo --config demo/ruff.toml && ruff format --check demo --config demo/ruff.toml
      - name: Headless UI tests (Streamlit AppTest)
        run: pytest demo/tests -q
      - name: Server boots
        run: |
          streamlit run demo/streamlit_app.py --server.headless true --server.port 8599 &
          for i in $(seq 1 30); do curl -fsS localhost:8599/_stcore/health && exit 0; sleep 1; done
          exit 1
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r demo/requirements.txt
