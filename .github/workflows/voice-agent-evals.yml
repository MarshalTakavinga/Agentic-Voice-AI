name: 03-voice-agent-evals

# Runs when the framework changes and when the IVR it gates changes: every change to 01 is
# evaluated black-box, from the outside, in addition to 01's own tests.
on:
  push:
    branches: [main]
    paths: ["03-voice-agent-evals/**", "01-agentic-voice-ivr/**", ".github/workflows/voice-agent-evals.yml"]
  pull_request:
    paths: ["03-voice-agent-evals/**", "01-agentic-voice-ivr/**", ".github/workflows/voice-agent-evals.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-agent-evals-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 03-voice-agent-evals

env:
  IVR_LOG_LEVEL: WARNING

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            03-voice-agent-evals/requirements.lock
            01-agentic-voice-ivr/requirements.lock
      - name: Install (framework + the IVR for integration tests)
        run: make install install-ivr
      - name: Lint
        run: make lint
      - name: Tests
        run: pytest --cov=vae --cov-report=xml --cov-fail-under=90
      - name: Suite parses
        run: make validate

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit pip-audit
      - name: SAST (bandit)
        run: bandit -r vae -ll
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.lock

  ivr-gate:
    # The full suite, a fresh IVR per call, through the reusable action in this folder.
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: 01-agentic-voice-ivr/requirements.lock
      - name: Install the IVR
        run: pip install -r ../01-agentic-voice-ivr/requirements.lock && pip install -e ../01-agentic-voice-ivr
      - name: Evaluate the IVR (scenarios, ASR noise, injection, policy, latency)
        uses: ./03-voice-agent-evals
        with:
          suite: 03-voice-agent-evals/suites/ivr
          app: app.main:create_app()
          app-path: 01-agentic-voice-ivr
          isolate: "true"
          api-key: change-me-local-only
          baseline: 03-voice-agent-evals/baselines/ivr.json
          report: 03-voice-agent-evals/reports/ci-ivr-report.md
          results: 03-voice-agent-evals/reports/ci-ivr-results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-agent-evals-ivr
          path: 03-voice-agent-evals/reports/ci-ivr-*

  ivr-live:
    # Over a real network: the IVR as a uvicorn server, then a correctness-checked load test.
    runs-on: ubuntu-latest
    needs: [test]
    env:
      IVR_API_KEY: ci-live-key
      VAE_API_KEY: ci-live-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            03-voice-agent-evals/requirements.lock
            01-agentic-voice-ivr/requirements.lock
      - name: Install
        run: make install install-ivr
      - name: Start the IVR
        working-directory: 01-agentic-voice-ivr
        run: |
          uvicorn app.main:app --port 8000 --no-access-log &
          for i in $(seq 1 30); do curl -fsS localhost:8000/health/ready && exit 0; sleep 1; done
          exit 1
      - name: Clean + injection scenarios over HTTP
        run: make ivr-live
      - name: Load test (every call checked for correctness)
        run: make load
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: voice-agent-evals-live
          path: |
            03-voice-agent-evals/reports/ivr-live-report.md
            03-voice-agent-evals/reports/ivr-load-report.md

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t vae:ci .
      - name: Smoke test
        run: docker run --rm vae:ci validate suites/ivr | grep -q "22 scenarios"
      - name: Compose (IVR + evals in containers)
        run: docker compose up --build --abort-on-container-exit --exit-code-from evals
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vae:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
