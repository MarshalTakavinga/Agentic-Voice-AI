name: 02-sip-call-doctor

on:
  push:
    branches: [main]
    paths: ["02-sip-call-doctor/**", ".github/workflows/sip-call-doctor.yml"]
  pull_request:
    paths: ["02-sip-call-doctor/**", ".github/workflows/sip-call-doctor.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sip-call-doctor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 02-sip-call-doctor

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 02-sip-call-doctor/requirements.lock
      - name: Install
        run: pip install -r requirements.lock && pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest --cov=sipdoc --cov-report=xml --cov-fail-under=90
      - name: Evals
        run: python scripts/generate_captures.py && python scripts/run_evals.py --fail-under 1.0
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: sip-call-doctor-reports
          path: |
            02-sip-call-doctor/coverage.xml
            02-sip-call-doctor/evals/latest_report.md

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit pip-audit
      - name: SAST (bandit)
        run: bandit -r sipdoc -ll
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.lock

  container:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t svc:ci .
      - name: Smoke test
        run: |
          docker run -d --name svc -p 8000:8000 -e SIPDOC_API_KEY=ci-key svc:ci
          for i in $(seq 1 20); do curl -fsS localhost:8000/health/ready && break; sleep 1; done
          curl -fsS -X POST localhost:8000/v1/analyses -H "X-API-Key: ci-key" \
            -F capture=@captures/nat_one_way_audio.pcap | jq -r '.calls[0].root_cause' \
            | grep -qx media_to_private_address
      - name: Image scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: svc:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
